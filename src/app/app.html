<div class="erp-app-container ig-typography">
  <!-- Top Navbar -->
  <igx-navbar [isActionButtonVisible]="false" class="app-navbar">
    <div igxNavbarAction>
      <igx-icon igxRipple (click)="toggleDrawer()" style="cursor:pointer">menu</igx-icon>
    </div>
    <span igxNavbarTitle style="font-size:20px;font-weight:500;letter-spacing:0.5px;flex:1">FoodPro ERP</span>
    @if ((dataService.alerts$ | async)?.length) {
      <span style="position:relative;display:inline-flex;align-items:center;margin-right:8px">
        <igx-icon>notifications</igx-icon>
        <igx-badge
          [value]="((dataService.alerts$ | async)?.length ?? 0)"
          type="error"
          style="position:absolute;top:-6px;right:-6px">
        </igx-badge>
      </span>
    }
  </igx-navbar>

  <div class="erp-main-layout">
    <!-- Navigation Drawer -->
    <igx-nav-drawer #drawer [isOpen]="true" [pinThreshold]="0" [pin]="true" style="--igx-nav-drawer-width:220px; --igx-nav-drawer-background:#1A237E;">
      <ng-template igxDrawer>
        <nav>
          <span igxDrawerItem [isHeader]="true" class="erp-nav-header">Main Menu</span>
          @for (item of navItems; track item.path) {
            <span igxDrawerItem igxRipple
              [routerLink]="item.path"
              routerLinkActive
              #rla="routerLinkActive"
              [active]="rla.isActive"
              style="color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:12px; padding:12px 20px; cursor:pointer;">
              <igx-icon style="color:rgba(255,255,255,0.85)">{{ item.icon }}</igx-icon>
              <span>{{ item.label }}</span>
            </span>
          }
        </nav>
      </ng-template>
    </igx-nav-drawer>

    <!-- Main Content Area -->
    <main class="erp-content">
      <router-outlet />
    </main>
  </div>
</div>
