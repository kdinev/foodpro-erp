<div class="erp-app-container ig-typography">
  <!-- Top Navbar -->
  <igx-navbar [isActionButtonVisible]="false">
    <div igxNavbarAction>
      <button igxIconButton="flat" (click)="toggleDrawer()">
        <igx-icon>menu</igx-icon>
      </button>
    </div>

    <span igxNavbarTitle>FoodPro ERP</span>

    @if ((dataService.alerts$ | async)?.length) {
      <span class="notification-wrapper">
        <igx-icon>notifications</igx-icon>
        <igx-badge
          [value]="((dataService.alerts$ | async)?.length ?? 0)"
          type="error"
          class="notification-badge">
        </igx-badge>
      </span>
    }
  </igx-navbar>

  <div class="erp-main-layout">
    <!-- Navigation Drawer -->
    <igx-nav-drawer #drawer [isOpen]="true" [pinThreshold]="0" [pin]="true">
      <ng-template igxDrawer>
        <nav>
          <span igxDrawerItem [isHeader]="true">Main Menu</span>

          @for (item of navItems; track item.path) {
            <span igxDrawerItem igxRipple
              [routerLink]="item.path"
              routerLinkActive
              #rla="routerLinkActive"
              [active]="rla.isActive">
              <igx-icon>{{ item.icon }}</igx-icon>
              <span>{{ item.label }}</span>
            </span>
          }
        </nav>
      </ng-template>
    </igx-nav-drawer>

    <!-- Main Content Area -->
    <main class="erp-content">
      <router-outlet />
    </main>
  </div>
</div>
